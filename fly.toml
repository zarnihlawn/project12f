app = 'project12f'
primary_region = 'sin'

[build]
[env]
  HOST = '0.0.0.0'
  HOST_HEADER = 'x-forwarded-host'
  PORT = '3000'
  PROTOCOL_HEADER = 'x-forwarded-proto'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
