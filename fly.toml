# fly.toml app configuration file for project12f
#
# See https://fly.io/docs/reference/configuration/

app = 'project12f'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Fly’s edge sets X-Forwarded-Proto (https). The VM still sees HTTP internally, so without this
# SvelteKit may think the site is http://… and reject POST forms with:
#   "Cross-site POST form submissions are forbidden"
# Also set ORIGIN to the same public URL (Better Auth baseURL):
#   fly secrets set ORIGIN=https://project12f.fly.dev
[env]
  PORT = '3000'
  HOST = '0.0.0.0'
  PROTOCOL_HEADER = 'x-forwarded-proto'
  HOST_HEADER = 'x-forwarded-host'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
